name: Otras marcas data refresh

# Lee de la base propia de Gescom la venta y la cobertura de las otras marcas
# (no Pepsico ni Georgalos) y commitea los JSON que lee el panel:
# indice.json, fecha.txt y meses/*.json, en la raiz del repo (GitHub Pages).
on:
  schedule:
    # Cada 1 hora de 08:15 a 20:15 hora argentina (UTC-3), lunes a sabado.
    - cron: "15 11-23 * * 1-6"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: otras-marcas-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch Otras marcas data (base propia)
        env:
          BASE_CLAVE: ${{ secrets.BASE_CLAVE }}
        run: python tools/otras_marcas.py

      - name: Commit data if changed
        run: |
          git config user.name  "otras-marcas-bot"
          git config user.email "otras-marcas-bot@users.noreply.github.com"
          git add -A indice.json fecha.txt meses/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore(otras-marcas): refresh data $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado, reintento $i tras rebase..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep 5
          done
          echo "::error title=Otras marcas::No se pudo pushear los datos tras 3 intentos."
          exit 1
